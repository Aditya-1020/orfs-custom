[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asicflow-orfs"
version = "0.4.0"
description = "Project-first orchestration and analysis tools for OpenROAD-flow-scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
asicflow = "asicflow.flow:main"
orfsx = "asicflow.simple:main"

[tool.setuptools.packages.find]
include = ["asicflow*"]

[tool.setuptools.package-data]
asicflow = ["configs/*.yaml", "configs/**/*.yaml", "tcl/*.tcl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]
